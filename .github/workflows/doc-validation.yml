name: Documentation Validation

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/*.md'
      - 'docs/**/*.md'
      - 'src/azlin/cli.py'
      - 'src/azlin/commands/*.py'
      - 'scripts/validate_documentation.py'
      - 'scripts/check_doc_code_references.py'
      - 'scripts/test_check_doc_code_references.py'
      # A rename in the Rust sources can dangle a doc citation without the
      # doc changing, so the reference check has to run on those too.
      - 'rust/crates/**/*.rs'
      - '.github/workflows/doc-validation.yml'
  push:
    branches: [main, develop]
    paths:
      - 'README.md'
      - 'docs/*.md'
      - 'docs/**/*.md'
      - 'src/azlin/cli.py'
      - 'src/azlin/commands/*.py'
      - 'scripts/check_doc_code_references.py'
      - 'scripts/test_check_doc_code_references.py'
      - 'rust/crates/**/*.rs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

permissions: {}

jobs:
  validate-documentation:
    name: Validate Documentation Consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1  # Shallow clone for speed

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: pip-doc-validation-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-doc-validation-${{ runner.os }}-

      - name: Install dependencies
        run: |
          # Install Click which is required for the validation script
          # Note: anthropic and other heavy dependencies are optional
          # The script will work without them (with limited validation)
          pip install --quiet click

      - name: Validate documentation consistency
        run: |
          python scripts/validate_documentation.py
        env:
          # Ensure colored output is disabled for CI
          NO_COLOR: "1"

      # Reference docs cite Rust symbols instead of copying the argv and
      # message text the tests already own (#1103). A pointer rots the same
      # way a copy does, and a dangling one is worse: it reads as a citation
      # and leads nowhere. Its own tests run first, because a checker that
      # cannot fail is worse than no checker.
      - name: Test the doc-reference checker
        run: python scripts/test_check_doc_code_references.py

      - name: Check reference docs cite symbols that exist
        run: python scripts/check_doc_code_references.py

      - name: Report validation results
        if: failure()
        run: |
          echo "❌ Documentation validation failed!"
          echo ""
          echo "Documentation is inconsistent with CLI implementation."
          echo "Please review the validation errors above and update documentation accordingly."
          echo ""
          echo "Common issues:"
          echo "  - CLI commands not documented in README.md"
          echo "  - Documentation mentions removed or renamed commands"
          echo "  - Command options missing from documentation"
          echo "  - Inconsistent command names between docs and CLI"
          echo ""
          echo "See DOCUMENTATION_FIX_PLAN.md for guidance on fixing documentation."
          exit 1

      - name: Success message
        if: success()
        run: |
          echo "✅ Documentation validation passed!"
          echo "All CLI commands are properly documented and consistent."
