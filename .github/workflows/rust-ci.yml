name: Rust CI

on:
  # The workflow file itself is included so that a change to Rust CI is
  # exercised by Rust CI. Without it, editing this file skips every job here
  # and a broken or weakened gate lands with a fully green PR.
  push:
    paths: ['rust/**', '.github/workflows/rust-ci.yml']
  pull_request:
    paths: ['rust/**', '.github/workflows/rust-ci.yml']

permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: rust
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --all --locked
        env:
          RUST_MIN_STACK: "8388608"
      - name: Clippy
        run: cargo clippy --all --locked -- -D warnings

  # Formatting gate. Kept as its own job rather than a step inside
  # build-and-test so it reports in seconds instead of behind a ~6 minute
  # build, and so a formatting failure does not hide build or test results.
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Supply-chain gate: fail CI on any RustSec advisory not explicitly
  # acknowledged in rust/.cargo/audit.toml. Reads the committed Cargo.lock.
  cargo-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install cargo-audit
        uses: taiki-e/install-action@9bcaee1dcae34154180f412e2fa69355a7cda9f6 # v2.82.6
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit
